server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # /api → SessionService (mantiene el path /api).
    location /api/ {
        proxy_pass http://sessionservice:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # /team-api → TeamService, reescrito a /api (igual que el proxy de Vite).
    location /team-api/ {
        rewrite ^/team-api/(.*)$ /api/$1 break;
        proxy_pass http://teamservice:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # /hubs → SignalR (SessionService) con WebSockets.
    location /hubs/ {
        proxy_pass http://sessionservice:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }

    # SPA fallback.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
